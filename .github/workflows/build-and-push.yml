name: Build and Push Docker Images

# CI builds the CLASSIC (r.avaflow 3G) web app image from this repo.
# The 40G image CANNOT be built here: Dockerfile.prod-40g uses build context
# of the repo's PARENT directory (r.avaflow.40G engine sources live outside
# the repository). Build and push webapp-40g-latest manually on a machine
# that has both trees, e.g.:
#   docker build -f Dockerfile.prod-40g -t ghcr.io/kostyanp95/r-avaflow:webapp-40g-latest ..
# See deploy/README.md ("Авторизация" / build notes).

on:
  push:
    branches: [main, master]
    paths:
      - 'avaflow/**'
      - 'web-app/**'
      - 'Dockerfile.prod'
      - '.github/workflows/**'

jobs:
  build-classic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          cache-from: type=gha,scope=classic
          cache-to: type=gha,mode=max,scope=classic
          tags: |
            ghcr.io/${{ github.repository_owner }}/r-avaflow:webapp-latest
            ghcr.io/${{ github.repository_owner }}/r-avaflow:webapp-${{ github.sha }}
