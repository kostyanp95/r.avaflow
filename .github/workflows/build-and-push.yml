name: Build and Push Docker Images

on:
  push:
    branches: [main, master]
    paths:
      - 'r.avaflow/**'
      - 'r.avaflow.40G/**'
      - 'Dockerfile*'
      - '.github/workflows/**'

jobs:
  build-classic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./r.avaflow
          file: ./r.avaflow/Dockerfile.prod
          push: true
          cache-from: type=gha,scope=classic
          cache-to: type=gha,mode=max,scope=classic
          tags: |
            ghcr.io/${{ github.repository_owner }}/r-avaflow:webapp-latest
            ghcr.io/${{ github.repository_owner }}/r-avaflow:webapp-${{ github.sha }}

  build-40g:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./r.avaflow/Dockerfile.prod-40g
          push: true
          cache-from: type=gha,scope=40g
          cache-to: type=gha,mode=max,scope=40g
          tags: |
            ghcr.io/${{ github.repository_owner }}/r-avaflow:webapp-40g-latest
            ghcr.io/${{ github.repository_owner }}/r-avaflow:webapp-40g-${{ github.sha }}
