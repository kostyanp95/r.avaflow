# Example K3s Service/Endpoints manifests for an external Docker host.
# Documentation-only address: replace it with your deployment address before use.
# Apply: kubectl apply -f k3s-external-service.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: avaflow-classic
  namespace: default
  labels:
    app: avaflow-classic
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: avaflow-classic
  namespace: default
subsets:
  - addresses:
      - ip: 198.51.100.10  # RFC 5737 documentation address
    ports:
      - name: http
        port: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: avaflow-40g
  namespace: default
  labels:
    app: avaflow-40g
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3002
---
apiVersion: v1
kind: Endpoints
metadata:
  name: avaflow-40g
  namespace: default
subsets:
  - addresses:
      - ip: 198.51.100.10  # RFC 5737 documentation address
    ports:
      - name: http
        port: 3002
