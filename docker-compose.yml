version: '3.8'

services:
  avaflow-classic:
    image: ghcr.io/kostyanp95/r-avaflow:webapp-latest
    container_name: avaflow-classic
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - avaflow-classic-data:/data/projects
    environment:
      - NODE_ENV=production
      - AVAFLOW_MODULE=r.avaflow
      - AVAFLOW_PROJECTS_PATH=/data/projects
      # --- Telegram-bot authorization (see deploy/README.md) ---
      # Copy .env.example to .env next to this file and fill in values.
      - TG_AUTH_SECRET=${TG_AUTH_SECRET:-}
      - TG_ADMIN_IDS=${TG_ADMIN_IDS:-}
      - TG_BOT_USERNAME=${TG_BOT_USERNAME:-web_r_avaflow_bot}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      # This service polls the bot (exactly ONE poller per bot token allowed).
      - TG_BOT_POLLING=${TG_BOT_POLLING:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  avaflow-40g:
    image: ghcr.io/kostyanp95/r-avaflow:webapp-40g-latest
    container_name: avaflow-40g
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - avaflow-40g-data:/data/projects
    environment:
      - NODE_ENV=production
      - AVAFLOW_MODULE=r.avaflow.40G
      - AVAFLOW_PROJECTS_PATH=/data/projects
      - OMP_NUM_THREADS=8
      # --- Telegram-bot authorization ---
      # Same TG_AUTH_SECRET as classic: login tokens minted by the classic
      # container's bot are verified here statelessly.
      - TG_AUTH_SECRET=${TG_AUTH_SECRET:-}
      - TG_ADMIN_IDS=${TG_ADMIN_IDS:-}
      - TG_BOT_USERNAME=${TG_BOT_USERNAME:-web_r_avaflow_bot}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      # No polling here — only classic may call getUpdates.
      - TG_BOT_POLLING=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  avaflow-classic-data:
  avaflow-40g-data:
