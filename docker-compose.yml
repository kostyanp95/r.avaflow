version: '3.8'

services:
  avaflow-classic:
    image: ghcr.io/kostyanp95/r-avaflow:webapp-latest
    container_name: avaflow-classic
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - avaflow-classic-data:/data/projects
    environment:
      - NODE_ENV=production
      - AVAFLOW_MODULE=r.avaflow
      - AVAFLOW_PROJECTS_PATH=/data/projects
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  avaflow-40g:
    image: ghcr.io/kostyanp95/r-avaflow:webapp-40g-latest
    container_name: avaflow-40g
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - avaflow-40g-data:/data/projects
    environment:
      - NODE_ENV=production
      - AVAFLOW_MODULE=r.avaflow.40G
      - AVAFLOW_PROJECTS_PATH=/data/projects
      - OMP_NUM_THREADS=8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  avaflow-classic-data:
  avaflow-40g-data:
